<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Basic Page</title>
	<style>
		.cs-picture {
			display: block;
			width: 400px;
			height: 300px;
			overflow: hidden;
		}
		.cs-picture img {
			display: block;
			width: 400px;
			height: 300px;
		}
	</style>
</head>
<body>
	<picture class="cs-picture">
		<img src="/assets/images/hero.jpg" alt="hero image" width="400" height="300">
	</picture>
	<div style="height: 1500px;"></div>
	<picture class="cs-picture">
		<img src="/assets/images/section.jpg" alt="section image" width="400" height="300">
	</picture>
</body>
</html>
