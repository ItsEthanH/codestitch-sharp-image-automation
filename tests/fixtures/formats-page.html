<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Formats Page</title>
	<style>
		.cs-picture {
			display: block;
			width: 400px;
			height: 300px;
		}
		.cs-picture img {
			display: block;
			width: 400px;
			height: 300px;
		}
	</style>
</head>
<body>
	<!-- JPEG image -->
	<picture class="cs-picture">
		<img src="/assets/images/photo.jpg" alt="photo" width="400" height="300">
	</picture>
	<!-- PNG image -->
	<picture class="cs-picture">
		<img src="/assets/images/graphic.png" alt="graphic" width="400" height="300">
	</picture>
</body>
</html>
